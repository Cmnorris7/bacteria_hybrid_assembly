---
name: "nextpolish"
description: "Polish a long-read assembly with NextPolish"
keywords:
  - polishing
  - assembly
  - long reads
tools:
  - nextpolish:
      description: "Fast and accurate genome polishing for long-read assemblies"
      homepage: "https://github.com/Nextomics/NextPolish"
      documentation: "https://nextpolish.readthedocs.io/"
      licence:
        - "GPL-3.0"
input:
  - - meta:
        type: map
        description: "Sample metadata, for example [id: 'sample1']"
    - assembly:
        type: file
        description: "Assembly generated by NextDenovo"
        pattern: "*.{fa,fasta,fna}"
    - reads:
        type: file
        description: "Long reads used to polish the assembly"
        pattern: "*.{fastq,fq,fastq.gz,fq.gz}"
  - read_type:
      type: string
      description: "Read type: ont, clr, or hifi"
output:
  assembly:
    - - meta:
          type: map
          description: "Sample metadata"
      - "*.fasta.gz":
          type: file
          description: "NextPolish-polished assembly"
          pattern: "*.fasta.gz"
  log:
    - - meta:
          type: map
          description: "Sample metadata"
      - "*.nextpolish.log":
          type: file
          description: "NextPolish execution log"
          pattern: "*.nextpolish.log"
  versions_nextpolish:
    - - "${task.process}":
          type: string
          description: "Process name"
      - nextpolish:
          type: string
          description: "Tool name"
      - "nextPolish -v":
          type: eval
          description: "Tool version"