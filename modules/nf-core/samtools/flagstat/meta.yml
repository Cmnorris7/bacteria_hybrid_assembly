---
name: "nf-core/samtools/flagstat"
description: "Counts the number of alignments in a BAM/CRAM/SAM file for each FLAG\
  \ type"
keywords:
- "stats"
- "mapping"
- "counts"
- "bam"
- "sam"
- "cram"
tools:
- samtools:
    description: "SAMtools is a set of utilities for interacting with and post-processing\n\
      short DNA sequence read alignments in the SAM, BAM and CRAM formats, written\
      \ by Heng Li.\nThese files are generated as output by short read aligners like\
      \ BWA.\n"
    homepage: "http://www.htslib.org/"
    documentation: "http://www.htslib.org/doc/samtools.html"
    doi: "10.1093/bioinformatics/btp352"
    licence:
    - "MIT"
    identifier: "biotools:samtools"
input:
- - meta:
      type: "map"
      description: "Groovy Map containing sample information\ne.g. [ id:'test', single_end:false\
        \ ]\n"
  - bam:
      type: "file"
      description: "BAM/CRAM/SAM file"
      pattern: "*.{bam,cram,sam}"
      ontologies: []
  - bai:
      type: "file"
      description: "Index for BAM/CRAM/SAM file"
      pattern: "*.{bai,crai,sai}"
      ontologies: []
output:
  flagstat:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.flagstat':
        type: "file"
        description: "File containing samtools flagstat output"
        pattern: "*.{flagstat}"
        ontologies: []
  versions_samtools:
  - - ${task.process}:
        type: "string"
        description: "The name of the process"
    - samtools:
        type: "string"
        description: "The name of the tool"
    - samtools version | sed '1!d;s/.* //':
        type: "eval"
        description: "The expression to obtain the version of the tool"
topics:
  versions:
  - - ${task.process}:
        type: "string"
        description: "The name of the process"
    - samtools:
        type: "string"
        description: "The name of the tool"
    - samtools version | sed '1!d;s/.* //':
        type: "eval"
        description: "The expression to obtain the version of the tool"
authors:
- "@drpatelh"
maintainers:
- "@drpatelh"
- "@matthdsm"
version: "0.0.0-9339809"
license: "MIT License"
