---
name: "nf-core/samtools/coverage"
description: "produces a histogram or table of coverage per chromosome"
keywords:
- "depth"
- "samtools"
- "bam"
tools:
- samtools:
    description: "SAMtools is a set of utilities for interacting with and post-processing\n\
      short DNA sequence read alignments in the SAM, BAM and CRAM formats, written\
      \ by Heng Li.\nThese files are generated as output by short read aligners like\
      \ BWA.\n"
    homepage: "http://www.htslib.org/"
    documentation: "http://www.htslib.org/doc/samtools.html"
    doi: "10.1093/bioinformatics/btp352"
    licence:
    - "MIT"
    identifier: "biotools:samtools"
input:
- - meta:
      type: "map"
      description: "Groovy Map containing sample information\ne.g. [ id:'test', single_end:false\
        \ ]\n"
  - input:
      type: "file"
      description: "BAM/CRAM/SAM file"
      pattern: "*.{bam,cram,sam}"
      ontologies: []
  - input_index:
      type: "file"
      description: "BAM/CRAM index file"
      pattern: "*.{bai,crai}"
      ontologies: []
- - meta2:
      type: "map"
      description: "Groovy Map containing reference information\ne.g. [ id:'genome'\
        \ ]\n"
  - fasta:
      type: "file"
      description: "Reference genome file"
      pattern: "*.{fa,fasta}"
      ontologies: []
  - fai:
      type: "file"
      description: "Reference genome index file"
      pattern: "*.fai"
      ontologies: []
output:
  coverage:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.txt':
        type: "file"
        description: "Tabulated text containing the coverage at each position or region\
          \ or an ASCII-art histogram (with --histogram)."
        pattern: "*.txt"
        ontologies: []
  versions_samtools:
  - - ${task.process}:
        type: "string"
        description: "The name of the process"
    - samtools:
        type: "string"
        description: "The name of the tool"
    - samtools version | sed '1!d;s/.* //':
        type: "eval"
        description: "The expression to obtain the version of the tool"
topics:
  versions:
  - - ${task.process}:
        type: "string"
        description: "The name of the process"
    - samtools:
        type: "string"
        description: "The name of the tool"
    - samtools version | sed '1!d;s/.* //':
        type: "eval"
        description: "The expression to obtain the version of the tool"
authors:
- "@LouisLeNezet"
maintainers:
- "@LouisLeNezet"
- "@matthdsm"
version: "0.0.0-9339809"
license: "MIT License"
