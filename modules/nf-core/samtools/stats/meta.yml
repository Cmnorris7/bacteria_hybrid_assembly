---
name: "nf-core/samtools/stats"
description: "Produces comprehensive statistics from SAM/BAM/CRAM file"
keywords:
- "statistics"
- "counts"
- "bam"
- "sam"
- "cram"
tools:
- samtools:
    description: "SAMtools is a set of utilities for interacting with and post-processing\n\
      short DNA sequence read alignments in the SAM, BAM and CRAM formats, written\
      \ by Heng Li.\nThese files are generated as output by short read aligners like\
      \ BWA.\n"
    homepage: "http://www.htslib.org/"
    documentation: "http://www.htslib.org/doc/samtools.html"
    doi: "10.1093/bioinformatics/btp352"
    licence:
    - "MIT"
    identifier: "biotools:samtools"
input:
- - meta:
      type: "map"
      description: "Groovy Map containing sample information\ne.g. [ id:'test', single_end:false\
        \ ]\n"
  - input:
      type: "file"
      description: "BAM/CRAM file from alignment"
      pattern: "*.{bam,cram}"
      ontologies: []
  - input_index:
      type: "file"
      description: "BAI/CRAI file from alignment"
      pattern: "*.{bai,crai}"
      ontologies: []
- - meta2:
      type: "map"
      description: "Groovy Map containing reference information\ne.g. [ id:'genome'\
        \ ]\n"
  - fasta:
      type: "file"
      description: "Reference file the CRAM was created with (optional)"
      pattern: "*.{fasta,fa,fna}"
      ontologies: []
  - fai:
      type: "file"
      description: "FASTA ref index file"
      pattern: "*.{fasta,fa,fna}.fai"
      ontologies: []
output:
  stats:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.stats':
        type: "file"
        description: "File containing samtools stats output"
        pattern: "*.{stats}"
        ontologies: []
  versions_samtools:
  - - ${task.process}:
        type: "string"
        description: "Name of the process"
    - samtools:
        type: "string"
        description: "Name of the tool"
    - samtools version | sed "1!d;s/.* //":
        type: "eval"
        description: "The expression to obtain the version of the tool"
topics:
  versions:
  - - ${task.process}:
        type: "string"
        description: "Name of the process"
    - samtools:
        type: "string"
        description: "Name of the tool"
    - samtools version | sed "1!d;s/.* //":
        type: "eval"
        description: "The expression to obtain the version of the tool"
authors:
- "@drpatelh"
- "@FriederikeHanssen"
- "@ramprasadn"
maintainers:
- "@drpatelh"
- "@FriederikeHanssen"
- "@ramprasadn"
- "@matthdsm"
version: "0.0.0-9339809"
license: "MIT License"
