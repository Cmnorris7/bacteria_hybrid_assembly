---
name: "nf-core/minimap2/align"
description: "A versatile pairwise aligner for genomic and spliced nucleotide sequences"
keywords:
- "align"
- "fasta"
- "fastq"
- "genome"
- "paf"
- "reference"
tools:
- minimap2:
    description: "A versatile pairwise aligner for genomic and spliced nucleotide\
      \ sequences.\n"
    homepage: "https://github.com/lh3/minimap2"
    documentation: "https://github.com/lh3/minimap2#uguide"
    licence:
    - "MIT"
    identifier: ""
input:
- - meta:
      type: "map"
      description: "Groovy Map containing sample information\ne.g. [ id:'test', single_end:false\
        \ ]\n"
  - reads:
      type: "file"
      description: "List of input FASTA or FASTQ files of size 1 and 2 for single-end\n\
        and paired-end data, respectively.\n"
      ontologies: []
- - meta2:
      type: "map"
      description: "Groovy Map containing reference information\ne.g. [ id:'test_ref']\n"
  - reference:
      type: "file"
      description: "Reference database in FASTA format.\n"
      ontologies: []
- bam_format:
    type: "boolean"
    description: "Specify that output should be in BAM format"
- bam_index_extension:
    type: "string"
    description: "BAM alignment index extension (e.g. \"bai\")"
- cigar_paf_format:
    type: "boolean"
    description: "Specify that output CIGAR should be in PAF format"
- cigar_bam:
    type: "boolean"
    description: "Write CIGAR with >65535 ops at the CG tag. This is recommended when\n\
      doing XYZ (https://github.com/lh3/minimap2#working-with-65535-cigar-operations)\n"
output:
  paf:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.paf':
        type: "file"
        description: "Alignment in PAF format"
        pattern: "*.paf"
        ontologies: []
  bam:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.bam':
        type: "file"
        description: "Alignment in BAM format"
        pattern: "*.bam"
        ontologies: []
  index:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.bam.${bam_index_extension}':
        type: "file"
        description: "BAM alignment index"
        pattern: "*.bam.*"
        ontologies: []
  versions_minimap2:
  - - ${task.process}:
        type: "string"
        description: "The process name"
    - minimap2:
        type: "string"
        description: "The tool name"
    - minimap2 --version:
        type: "eval"
        description: "The tool version"
topics:
  versions:
  - - ${task.process}:
        type: "string"
        description: "The process name"
    - minimap2:
        type: "string"
        description: "The tool name"
    - minimap2 --version:
        type: "eval"
        description: "The tool version"
authors:
- "@heuermh"
- "@sofstam"
- "@sateeshperi"
- "@jfy133"
- "@fellen31"
maintainers:
- "@heuermh"
- "@sofstam"
- "@sateeshperi"
- "@jfy133"
- "@fellen31"
version: "0.0.0-be790aa"
license: "MIT License"
