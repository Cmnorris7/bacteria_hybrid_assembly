---
name: "nf-core/bwa/index"
description: "Create BWA index for reference genome"
keywords:
- "index"
- "fasta"
- "genome"
- "reference"
tools:
- bwa:
    description: "BWA is a software package for mapping DNA sequences against\na large\
      \ reference genome, such as the human genome.\n"
    homepage: "http://bio-bwa.sourceforge.net/"
    documentation: "https://bio-bwa.sourceforge.net/bwa.shtml"
    arxiv: "arXiv:1303.3997"
    licence:
    - "GPL-3.0-or-later"
    identifier: "biotools:bwa"
input:
- - meta:
      type: "map"
      description: "Groovy Map containing reference information.\ne.g. [ id:'test',\
        \ single_end:false ]\n"
  - fasta:
      type: "file"
      description: "Input genome fasta file"
      ontologies:
      - edam: "http://edamontology.org/data_2044"
      - edam: "http://edamontology.org/format_1929"
output:
  index:
  - - meta:
        type: "map"
        description: "Groovy Map containing reference information.\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - bwa:
        type: "map"
        description: "Groovy Map containing reference information.\ne.g. [ id:'test',\
          \ single_end:false ]\n"
        pattern: "*.{amb,ann,bwt,pac,sa}"
        ontologies:
        - edam: "http://edamontology.org/data_3210"
  versions_bwa:
  - - ${task.process}:
        type: "string"
        description: "The process the versions were collected from"
    - bwa:
        type: "string"
        description: "The tool name"
    - 'bwa 2>&1 | sed -n "s/^Version: //p"':
        type: "string"
        description: "The command used to generate the version of the tool"
topics:
  versions:
  - - ${task.process}:
        type: "string"
        description: "The process the versions were collected from"
    - bwa:
        type: "string"
        description: "The tool name"
    - 'bwa 2>&1 | sed -n "s/^Version: //p"':
        type: "string"
        description: "The command used to generate the version of the tool"
authors:
- "@drpatelh"
- "@maxulysse"
maintainers:
- "@maxulysse"
- "@gallvp"
version: "0.0.0-6c4ed3a"
license: "MIT License"
