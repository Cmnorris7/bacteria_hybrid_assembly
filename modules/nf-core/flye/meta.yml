---
name: "nf-core/flye"
description: "De novo assembler for single molecule sequencing reads"
keywords:
- "assembly"
- "genome"
- "de novo"
- "genome assembler"
- "single molecule"
tools:
- flye:
    description: "Fast and accurate de novo assembler for single molecule sequencing\
      \ reads"
    homepage: "https://github.com/fenderglass/Flye"
    documentation: "https://github.com/fenderglass/Flye/blob/flye/docs/USAGE.md"
    tool_dev_url: "https://github.com/fenderglass/Flye"
    doi: "10.1038/s41592-020-00971-x"
    licence:
    - "BSD-3-clause"
    identifier: "biotools:Flye"
input:
- - meta:
      type: "map"
      description: "Groovy Map containing sample information\ne.g. [ id:'test' ]\n"
  - reads:
      type: "file"
      description: "Input reads from Oxford Nanopore or PacBio data in FASTA/FASTQ\
        \ format."
      pattern: "*.{fasta,fastq,fasta.gz,fastq.gz,fa,fq,fa.gz,fq.gz}"
      ontologies:
      - edam: "http://edamontology.org/format_1930"
- mode:
    type: "string"
    description: "Flye mode depending on the input data (source and error rate)"
    pattern: "--pacbio-raw|--pacbio-corr|--pacbio-hifi|--nano-raw|--nano-corr|--nano-hq"
output:
  fasta:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test' ]\n"
    - '*.fasta.gz':
        type: "file"
        description: "Assembled FASTA file"
        pattern: "*.fasta.gz"
        ontologies:
        - edam: "http://edamontology.org/format_3989"
  gfa:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test' ]\n"
    - '*.gfa.gz':
        type: "file"
        description: "Repeat graph in gfa format"
        pattern: "*.gfa.gz"
        ontologies:
        - edam: "http://edamontology.org/format_3989"
  gv:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test' ]\n"
    - '*.gv.gz':
        type: "file"
        description: "Repeat graph in gv format"
        pattern: "*.gv.gz"
        ontologies:
        - edam: "http://edamontology.org/format_3989"
  txt:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test' ]\n"
    - '*.txt':
        type: "file"
        description: "Extra information and statistics about resulting contigs"
        pattern: "*.txt"
        ontologies: []
  log:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test' ]\n"
    - '*.log':
        type: "file"
        description: "Flye log file"
        pattern: "*.log"
        ontologies: []
  json:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test' ]\n"
    - '*.json':
        type: "file"
        description: "Flye parameters"
        pattern: "*.json"
        ontologies:
        - edam: "http://edamontology.org/format_3464"
  versions_flye:
  - - ${task.process}:
        type: "string"
        description: "The name of the process"
    - flye:
        type: "string"
        description: "The name of the tool"
    - flye --version:
        type: "eval"
        description: "The expression to obtain the version of the tool"
topics:
  versions:
  - - ${task.process}:
        type: "string"
        description: "The name of the process"
    - flye:
        type: "string"
        description: "The name of the tool"
    - flye --version:
        type: "eval"
        description: "The expression to obtain the version of the tool"
authors:
- "@mirpedrol"
maintainers:
- "@mirpedrol"
version: "0.0.0-6c4ed3a"
license: "MIT License"
