---
name: "nf-core/canu"
description: "Accurate assembly of segmental duplications, satellites, and allelic\
  \ variants from high-fidelity long reads."
keywords:
- "Assembly"
- "pacbio"
- "hifi"
- "nanopore"
tools:
- canu:
    description: "Canu is a fork of the Celera Assembler designed for high-noise single-molecule\
      \ sequencing."
    homepage: "https://canu.readthedocs.io/en/latest/index.html#"
    documentation: "https://canu.readthedocs.io/en/latest/tutorial.html"
    tool_dev_url: "https://github.com/marbl/canu"
    doi: "10.1101/gr.215087.116"
    licence:
    - "GPL v2 and others"
    identifier: "biotools:canu"
input:
- - meta:
      type: "map"
      description: "Groovy Map containing sample information\ne.g. [ id:'test', single_end:true\
        \ ]\n"
  - reads:
      type: "file"
      description: "fasta/fastq file"
      pattern: "*.{fasta,fastq}"
      ontologies:
      - edam: "http://edamontology.org/format_1930"
- mode:
    type: "string"
    description: "Canu mode depending on the input data (source and error rate)"
    pattern: "-pacbio|-nanopore|-pacbio-hifi"
- genomesize:
    type: "string"
    description: "An estimate of the size of the genome. Common suffices are allowed,\
      \ for example, 3.7m or 2.8g"
    pattern: "<number>[g|m|k]"
output:
  report:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.report':
        type: "file"
        description: "Most of the analysis reported during assembly"
        pattern: "*.report"
        ontologies: []
  assembly:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.contigs.fasta.gz':
        type: "file"
        description: "Everything which could be assembled and is the full assembly,\
          \ including both unique, repetitive, and bubble elements."
        pattern: "*.contigs.fasta"
        ontologies: []
  contigs:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.unassembled.fasta.gz':
        type: "file"
        description: "Reads and low-coverage contigs which could not be incorporated\
          \ into the primary assembly."
        pattern: "*.unassembled.fasta"
        ontologies: []
  corrected_reads:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.correctedReads.fasta.gz':
        type: "file"
        description: "The reads after correction."
        pattern: "*.correctedReads.fasta.gz"
        ontologies:
        - edam: "http://edamontology.org/format_3989"
  corrected_trimmed_reads:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.trimmedReads.fasta.gz':
        type: "file"
        description: "The corrected reads after overlap based trimming"
        pattern: "*.trimmedReads.fasta.gz"
        ontologies:
        - edam: "http://edamontology.org/format_3989"
  metadata:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.contigs.layout':
        type: "file"
        description: "(undocumented)"
        pattern: "*.contigs.layout"
        ontologies: []
  contig_position:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.contigs.layout.readToTig':
        type: "file"
        description: "The position of each read in a contig"
        pattern: "*.contigs.layout.readToTig"
        ontologies: []
  contig_info:
  - - meta:
        type: "map"
        description: "Groovy Map containing sample information\ne.g. [ id:'test',\
          \ single_end:false ]\n"
    - '*.contigs.layout.tigInfo':
        type: "file"
        description: "A list of the contigs, lengths, coverage, number of reads and\
          \ other metadata. Essentially the same information provided in the FASTA\
          \ header line."
        pattern: "*.contigs.layout.tigInfo"
        ontologies: []
  versions_canu:
  - - ${task.process}:
        type: "string"
        description: "The name of the process"
    - canu:
        type: "string"
        description: "The name of the tool"
    - "2.3":
        type: "string"
        description: "The expression to obtain the version of the tool"
  versions_minimap2:
  - - ${task.process}:
        type: "string"
        description: "The name of the process"
    - minimap2:
        type: "string"
        description: "The name of the tool"
    - minimap2 --version:
        type: "eval"
        description: "The expression to obtain the version of the tool"
  versions_samtools:
  - - ${task.process}:
        type: "string"
        description: "The name of the process"
    - samtools:
        type: "string"
        description: "The name of the tool"
    - samtools version | sed '1!d;s/.* //':
        type: "eval"
        description: "The expression to obtain the version of the tool"
topics:
  versions:
  - - ${task.process}:
        type: "string"
        description: "The name of the process"
    - canu:
        type: "string"
        description: "The name of the tool"
    - "2.3":
        type: "string"
        description: "The expression to obtain the version of the tool"
  - - ${task.process}:
        type: "string"
        description: "The name of the process"
    - minimap2:
        type: "string"
        description: "The name of the tool"
    - minimap2 --version:
        type: "eval"
        description: "The expression to obtain the version of the tool"
  - - ${task.process}:
        type: "string"
        description: "The name of the process"
    - samtools:
        type: "string"
        description: "The name of the tool"
    - samtools version | sed '1!d;s/.* //':
        type: "eval"
        description: "The expression to obtain the version of the tool"
authors:
- "@scorreard"
maintainers:
- "@scorreard"
version: "0.0.0-6c4ed3a"
license: "MIT License"
